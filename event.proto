syntax = "proto3";

package panelclone;

message PushUpdate {
  repeated PushEvent updates = 1;
}

message PushEvent {
  oneof event {
    DrefValue drefWrite = 1;
    DrefSend drefSend = 2;
    CommandEvent command = 3;
    WeatherRequest weatherRequest = 4;
    RadarConfig radarConfig = 5;
  }
}

message StateUpdate {
  uint32 frame = 1;

  // This only contains indexes for NEW drefs
  // not present in previous state updates...
  repeated PubValIndex publishedValueIndexes = 2;

  // Changes in state...
  repeated DrefValue drefChanges = 3;

  optional x264FrameData panelFrameData = 4;

  // Weather radar data (from RADR protocol, forwarded by plugin)
  optional RadarFrame radarFrame = 5;

  // Weather probe response (from XPLMGetWeatherAtLocation)
  optional WeatherResponse weatherResponse = 6;
}

message x264FrameData {
    int32 cols = 1;
    int32 rows = 2;
    int32 channels = 3;
    bytes image_bytes = 4;
}

message PubValIndex {
  int32 index = 1;
  string dataref = 2;
  int32 dref_index = 3;
}

message StateRequest {
  repeated RegisterDref drefs = 2;
}

message RegisterDref {
  string dataref = 1;
  int32 index = 2;
}

message Snapshot {
  StateUpdate frameSnapshot = 2;
}

message DrefIntArrayValue {
  int32 value = 1;
  uint32 index = 2;
}

message DrefFloatArrayValue {
  float value = 1;
  uint32 index = 2;
}

message DrefByteValue {
  bytes value = 1;
  uint32 size = 2;
}

message DrefValue {
  uint32 index = 1;
  oneof value {
    int32 intVal = 2;
    float floatVal = 3;
    //DrefIntArrayValue intArrayVal = 4;
    //DrefFloatArrayValue floatArrayVal = 5;
    double doubleVal = 6;
    DrefByteValue byteVal = 7;
  }
}

message DrefSend {
  string dataref = 1;
  int32 index = 2;
  oneof value {
    int32 intVal = 3;
    float floatVal = 4;
    string stringVal = 5;
  }
}

// --- Commands (Phase 4) ---

message CommandEvent {
  string command = 1;
  enum Action {
    ONCE = 0;
    BEGIN = 1;
    END = 2;
  }
  Action action = 2;
}

// --- Weather Radar / RADR (Phase 5-6) ---

message RadarConfig {
  // Request plugin to start/stop RADR data forwarding
  bool enabled = 1;
  int32 points_per_tx = 2;  // RADR resolution (default 1024)
}

message RadarPoint {
  float lon = 1;
  float lat = 2;
  float cloud_bases_m = 3;
  float cloud_tops_m = 4;
  float clouds_ratio = 5;
  float precip_ratio = 6;
}

message RadarFrame {
  repeated RadarPoint points = 1;
}

// --- Weather Probe API (Phase 5) ---
// Uses XPLMGetWeatherAtLocation (XP12 SDK 4.0+)

message WeatherRequest {
  // Define a 3D grid to probe weather at
  float min_lat = 1;
  float max_lat = 2;
  float min_lon = 3;
  float max_lon = 4;
  float min_alt_m = 5;
  float max_alt_m = 6;
  int32 lat_steps = 7;
  int32 lon_steps = 8;
  int32 alt_steps = 9;
  uint32 request_id = 10;  // Client-assigned ID for matching response
}

message CloudLayer {
  int32 type = 1;       // Cloud type enum
  float coverage = 2;   // 0.0 - 1.0
  float alt_base_m = 3;
  float alt_top_m = 4;
}

message WindLayer {
  float alt_m = 1;
  float speed_mps = 2;
  float direction_deg = 3;
  float gust_speed_mps = 4;
  float shear = 5;
  float turbulence = 6;
}

message WeatherPoint {
  float lat = 1;
  float lon = 2;
  float alt_m = 3;
  float temperature_c = 4;
  float dewpoint_c = 5;
  float precip_rate = 6;
  float visibility_m = 7;
  float pressure_pa = 8;
  repeated CloudLayer clouds = 9;
  repeated WindLayer winds = 10;
}

message WeatherResponse {
  uint32 request_id = 1;  // Matches WeatherRequest.request_id
  repeated WeatherPoint points = 2;
}
